plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "co.triptel.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Same identity as the React Native app (see DECISIONS.md) so the Google
        // OAuth Android client and the triptel:// return scheme are shared.
        applicationId = "co.triptel.app"
        // flutter_secure_storage needs 23; EuiccManager (eSIM detection) needs 28
        // and is guarded at runtime, so older phones report "unknown", not a crash.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO before store release: real upload keystore.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
