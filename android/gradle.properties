org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# mobile_scanner (FR-L902) ships Kotlin sources from the pub cache on a
# different drive (C:) than this project (D:); Kotlin's incremental
# compiler's cache-path relativization throws "this and base files have
# different roots" on Windows in that case. Incremental compilation is a
# build-speed optimization only -- disabling it is the documented
# workaround and does not affect build correctness.
kotlin.incremental=false
